# G1 Kinematics Configuration
# Full joint specification for the Unitree G1 EDU (43-DoF) with Dex3-1 hands
# Joint ordering matches isri-aist/g1_description URDF (29-DoF body + 14-DoF hands)

robot_name: "Unitree G1 EDU"
dof: 43
mass: 35.0
com_height_nominal: 0.85

# Joint ordering (43 total)
# Indices 0–28: 29-DoF body (from isri-aist/g1_description)
# Indices 29–42: 14-DoF hands (Dex3-1, 7 per hand)

joint_names:
  # Left leg (6)
  - left_hip_pitch_joint    # [0]  axis: +Y
  - left_hip_roll_joint     # [1]  axis: +X
  - left_hip_yaw_joint      # [2]  axis: +Z
  - left_knee_joint         # [3]  axis: +Y
  - left_ankle_pitch_joint  # [4]  axis: +Y
  - left_ankle_roll_joint   # [5]  axis: +X
  # Right leg (6)
  - right_hip_pitch_joint   # [6]
  - right_hip_roll_joint    # [7]
  - right_hip_yaw_joint     # [8]
  - right_knee_joint        # [9]
  - right_ankle_pitch_joint # [10]
  - right_ankle_roll_joint  # [11]
  # Waist (3)
  - waist_yaw_joint         # [12] axis: +Z
  - waist_roll_joint        # [13] axis: +X
  - waist_pitch_joint       # [14] axis: +Y
  # Left arm (7)
  - left_shoulder_pitch_joint  # [15] axis: +Y
  - left_shoulder_roll_joint   # [16] axis: +X
  - left_shoulder_yaw_joint    # [17] axis: +Z
  - left_elbow_joint           # [18] axis: +Y
  - left_wrist_roll_joint      # [19] axis: +X
  - left_wrist_pitch_joint     # [20] axis: +Y
  - left_wrist_yaw_joint       # [21] axis: +Z
  # Right arm (7)
  - right_shoulder_pitch_joint # [22]
  - right_shoulder_roll_joint  # [23]
  - right_shoulder_yaw_joint   # [24]
  - right_elbow_joint          # [25]
  - right_wrist_roll_joint     # [26]
  - right_wrist_pitch_joint    # [27]
  - right_wrist_yaw_joint      # [28]
  # Left hand — Dex3-1 (7)
  - left_hand_thumb_1     # [29]
  - left_hand_thumb_2     # [30]
  - left_hand_thumb_3     # [31]
  - left_hand_index_1     # [32]
  - left_hand_index_2     # [33]
  - left_hand_middle_1    # [34]
  - left_hand_middle_2    # [35]
  # Right hand — Dex3-1 (7)
  - right_hand_thumb_1    # [36]
  - right_hand_thumb_2    # [37]
  - right_hand_thumb_3    # [38]
  - right_hand_index_1    # [39]
  - right_hand_index_2    # [40]
  - right_hand_middle_1   # [41]
  - right_hand_middle_2   # [42]

joint_limits:
  # All values in radians
  left_hip_pitch:    [-0.5, 2.7]
  left_hip_roll:     [-1.0, 1.0]
  left_hip_yaw:      [-1.0, 1.0]
  left_knee:         [-0.5, 2.7]
  left_ankle_pitch:  [-0.5, 1.0]
  left_ankle_roll:   [-0.5, 0.5]

  right_hip_pitch:   [-0.5, 2.7]
  right_hip_roll:    [-1.0, 1.0]
  right_hip_yaw:     [-1.0, 1.0]
  right_knee:        [-0.5, 2.7]
  right_ankle_pitch: [-0.5, 1.0]
  right_ankle_roll:  [-0.5, 0.5]

  waist_yaw:    [-1.5, 1.5]
  waist_roll:   [-0.5, 0.5]
  waist_pitch:  [-1.0, 1.0]

  left_shoulder_pitch: [-3.0, 3.0]
  left_shoulder_roll:  [-1.5, 1.5]
  left_shoulder_yaw:   [-1.5, 1.5]
  left_elbow:          [-2.5, 0.1]
  left_wrist_roll:     [-3.0, 3.0]
  left_wrist_pitch:    [-1.5, 1.5]
  left_wrist_yaw:      [-1.0, 1.0]

  right_shoulder_pitch: [-3.0, 3.0]
  right_shoulder_roll:  [-1.5, 1.5]
  right_shoulder_yaw:   [-1.5, 1.5]
  right_elbow:          [-2.5, 0.1]
  right_wrist_roll:     [-3.0, 3.0]
  right_wrist_pitch:    [-1.5, 1.5]
  right_wrist_yaw:      [-1.0, 1.0]

  # Hand joints (Dex3-1): limited hyperextension, large flexion range
  left_hand_thumb_1:  [-0.1, 2.0]
  left_hand_thumb_2:  [-0.1, 2.0]
  left_hand_thumb_3:  [-0.1, 2.0]
  left_hand_index_1:  [-0.1, 2.0]
  left_hand_index_2:  [-0.1, 2.0]
  left_hand_middle_1: [-0.1, 2.0]
  left_hand_middle_2: [-0.1, 2.0]

  right_hand_thumb_1:  [-0.1, 2.0]
  right_hand_thumb_2:  [-0.1, 2.0]
  right_hand_thumb_3:  [-0.1, 2.0]
  right_hand_index_1:  [-0.1, 2.0]
  right_hand_index_2:  [-0.1, 2.0]
  right_hand_middle_1: [-0.1, 2.0]
  right_hand_middle_2: [-0.1, 2.0]
